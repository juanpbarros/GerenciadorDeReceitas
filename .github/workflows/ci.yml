name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  tests:
    name: Testes e build
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Rodar testes do frontend
        run: npm --workspace frontend test -- --runInBand

      - name: Gerar build do frontend
        run: npm --workspace frontend run build

      - name: Rodar testes do backend
        run: npm --workspace backend test

      - name: Validar arquivos de deploy
        run: |
          test -f render.yaml
          test -f vercel.json
